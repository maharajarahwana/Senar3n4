<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latihan Membaca Not</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        transition: background-color 0.1s;
    }

    canvas {
        width: 100%;
        max-width: 500px;
        height: auto;
    }

    .kedip-merah {
        background-color: red !important;
    }

    .kedip-hijau {
        background-color: lime !important;
    }
</style>
</head>

<body>

<canvas id="canvas" width="500" height="300"></canvas>

<script>

// =====================================================
// DAFTAR NADA
// =====================================================

const nada = [

    // Senar 4
    // D senar 4 fret 0
    {
        nama: "D",
        frekuensi: 146.83
    },

    // E senar 4 fret 2
    {
        nama: "E",
        frekuensi: 164.81
    },

    // F senar 4 fret 3
    {
        nama: "F",
        frekuensi: 174.61
    },

    // Senar 3
    // G senar 3 fret 0
    {
        nama: "G",
        frekuensi: 196.00
    },

    // A senar 3 fret 2
    {
        nama: "A",
        frekuensi: 220.00
    },

    // B senar 3 fret 4
    {
        nama: "B",
        frekuensi: 246.94
    }

];


// =====================================================
// CANVAS
// =====================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let target;


// =====================================================
// PILIH NOT RANDOM
// =====================================================

function pilihNot() {

    target = nada[
        Math.floor(Math.random() * nada.length)
    ];

    gambarNot();
}


// =====================================================
// GAMBAR NOT
// =====================================================

function gambarNot() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // -----------------------------
    // PARANADA
    // -----------------------------

    const x1 = 100;
    const x2 = 440;

    const jarak = 30;

    // Garis tengah = garis ke-3
    const garisTengah = 150;

    for (let i = -2; i <= 2; i++) {

        const y =
            garisTengah +
            i * jarak;

        ctx.beginPath();

        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);

        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;

        ctx.stroke();
    }


    // -----------------------------
    // KUNCI G
    // -----------------------------

    ctx.font = "115px serif";
    ctx.fillStyle = "black";

    ctx.fillText(
        "𝄞",
        35,
        185
    );


    // -----------------------------
    // POSISI NOT
    // -----------------------------
    //
    // B = garis tengah
    // A = spasi di bawah B
    // G = garis ke-2
    // F = spasi di bawah G
    // E = garis paling bawah
    // D = di bawah garis paling bawah
    //
    // Dalam notasi gitar, nada yang
    // terdengar satu oktaf lebih rendah
    // dari posisi not tertulis.
    //

    const posisi = {

        "B": 150,

        "A": 165,

        "G": 180,

        "F": 195,

        "E": 210,

        "D": 225

    };


    const y = posisi[target.nama];

    const x = 270;



    // -----------------------------
    // KEPALA NOT
    // -----------------------------

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        17,
        12,
        -0.3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // -----------------------------
    // BATANG NOT
    // -----------------------------

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y
    );

    ctx.lineTo(
        x + 15,
        y - 75
    );

    ctx.lineWidth = 4;

    ctx.stroke();

}


// =====================================================
// KEDIP LAYAR
// =====================================================

function kedip(warna) {

    document.body.classList.add(
        warna
    );

    setTimeout(() => {

        document.body.classList.remove(
            warna
        );

    }, 180);
}


// =====================================================
// AUDIO
// =====================================================

let audioContext;
let analyser;
let microphone;
let buffer;

async function mulaiMikrofon() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        microphone =
            audioContext.createMediaStreamSource(
                stream
            );


        analyser =
            audioContext.createAnalyser();


        analyser.fftSize = 4096;


        microphone.connect(
            analyser
        );


        buffer =
            new Float32Array(
                analyser.fftSize
            );


        deteksiNada();

    }

    catch (error) {

        console.log(error);

        document.body.innerHTML =
            "<h2>Izinkan akses mikrofon</h2>";

    }

}


// =====================================================
// DETEKSI NADA
// =====================================================

function deteksiNada() {

    analyser.getFloatTimeDomainData(
        buffer
    );


    const frekuensi =
        cariFrekuensi(
            buffer,
            audioContext.sampleRate
        );


    if (frekuensi > 0) {

        cekNada(frekuensi);

    }


    requestAnimationFrame(
        deteksiNada
    );

}


// =====================================================
// CARI FREKUENSI
// =====================================================

function cariFrekuensi(
    buffer,
    sampleRate
) {

    let rms = 0;


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rms +=
            buffer[i] *
            buffer[i];

    }


    rms =
        Math.sqrt(
            rms / buffer.length
        );


    if (rms < 0.015) {

        return -1;

    }


    let bestOffset = -1;
    let bestCorrelation = 0;


    for (
        let offset = 20;
        offset < 1000;
        offset++
    ) {

        let correlation = 0;


        for (
            let i = 0;
            i < buffer.length - offset;
            i++
        ) {

            correlation +=
                buffer[i] *
                buffer[i + offset];

        }


        correlation /=
            buffer.length - offset;


        if (
            correlation >
            bestCorrelation
        ) {

            bestCorrelation =
                correlation;

            bestOffset =
                offset;

        }

    }


    if (bestOffset === -1) {

        return -1;

    }


    return (
        sampleRate /
        bestOffset
    );

}


// =====================================================
// CEK NADA
// =====================================================

let waktuTerakhir = 0;

function cekNada(freq) {

    const sekarang =
        Date.now();


    // Mencegah satu petikan
    // terbaca berkali-kali

    if (
        sekarang -
        waktuTerakhir <
        500
    ) {

        return;

    }


    let terdekat = null;

    let selisihTerkecil =
        Infinity;


    for (const n of nada) {

        const selisih =
            Math.abs(
                freq -
                n.frekuensi
            );


        if (
            selisih <
            selisihTerkecil
        ) {

            selisihTerkecil =
                selisih;

            terdekat = n;

        }

    }


    // Toleransi 2,5%

    if (
        terdekat &&
        selisihTerkecil /
        terdekat.frekuensi <
        0.025
    ) {

        waktuTerakhir =
            sekarang;


        // -------------------------
        // BENAR
        // -------------------------

        if (
            terdekat.nama ===
            target.nama
        ) {

            kedip(
                "kedip-hijau"
            );


            setTimeout(() => {

                pilihNot();

            }, 180);

        }


        // -------------------------
        // SALAH
        // -------------------------

        else {

            kedip(
                "kedip-merah"
            );

            // NOT TETAP

        }

    }

}


// =====================================================
// MULAI OTOMATIS
// =====================================================

pilihNot();

mulaiMikrofon();

</script>

</body>
</html>
